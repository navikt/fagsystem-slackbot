---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: fagsystem-slackbot
  namespace: fagsystem-brukeropplevelse
  labels:
    team: fagsystem-brukeropplevelse
spec:
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/is_alive
  readiness:
    path: /internal/is_alive
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  ingresses:
    - https://fagsystem-slackbot.intern.dev.nav.no
  accessPolicy:
    outbound:
      external:
        - host: slack.com
        - host: api.slack.com
  env:
    - name: PORT
      value: "8080"
  envFrom:
    - secret: team-fagsystem-slackbot
